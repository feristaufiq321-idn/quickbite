<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickBite</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fffaf3;
            color: #292524;
        }
        nav {
            padding: 22px 8%;
            background: white;
            border-bottom: 1px solid #eee;
            font-size: 24px;
            font-weight: bold;
            color: #e85d04;
        }
        main {
            max-width: 900px;
            margin: 90px auto;
            padding: 24px;
            text-align: center;
        }
        .tag {
            display: inline-block;
            padding: 8px 14px;
            border-radius: 30px;
            background: #ffedd5;
            color: #c2410c;
            font-size: 14px;
        }
        h1 {
            font-size: clamp(36px, 7vw, 64px);
            margin: 24px 0 16px;
        }
        h1 span { color: #e85d04; }
        p {
            color: #78716c;
            font-size: 18px;
            line-height: 1.7;
        }
        a {
            display: inline-block;
            margin-top: 20px;
            padding: 14px 24px;
            background: #e85d04;
            color: white;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
        }
        footer {
            margin-top: 100px;
            color: #a8a29e;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <nav>🍔 QuickBite</nav>
    <main>
        <div class="tag">Selamat datang di QuickBite</div>
        <h1>Lapar? <span>QuickBite!</span></h1>
        <p>
            Temukan pengalaman pesan makanan yang praktis
            dalam satu tempat.
        </p>
        <a href="/menu">Jelajahi Menu</a>
        <footer>QuickBite &copy; 2026</footer>
    </main>
</body>
</html>
